openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Signed-in user identity and onboarding
  - name: dashboards
    description: Role-based dashboard summaries
  - name: programs
    description: Public program catalog
  - name: notifications
    description: In-app notifications
  - name: admin
    description: Admin PBA operations and governance
  - name: passport
    description: Professional Passport settings and public profile
  - name: talent-pool
    description: Consent-aware Talent Pool discovery
  - name: company
    description: Company talent requirements and consented talent pool
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get current user
      description: Returns the signed-in user's role and onboarding profile.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/member:
    post:
      operationId: saveMemberOnboarding
      tags: [identity]
      summary: Save member onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberOnboardingInput"
      responses:
        "200":
          description: Saved member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid onboarding data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Onboarding role has already been finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/company:
    post:
      operationId: saveCompanyOnboarding
      tags: [identity]
      summary: Save company onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyOnboardingInput"
      responses:
        "200":
          description: Saved company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid onboarding data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Onboarding role has already been finalized or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/member:
    get:
      operationId: getMemberDashboard
      tags: [dashboards]
      summary: Get member dashboard
      responses:
        "200":
          description: Member dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/journey:
    get:
      operationId: getMemberJourney
      tags: [dashboards]
      summary: Get the complete member competency journey
      responses:
        "200":
          description: Diagnostic, evidence, learning progress, opportunities, and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberJourney"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/diagnostics:
    post:
      operationId: saveMemberDiagnostic
      tags: [dashboards]
      summary: Save a member readiness diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberDiagnosticInput"
      responses:
        "200":
          description: Saved readiness diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDiagnostic"
        "400":
          description: Invalid diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/evidence:
    post:
      operationId: saveMemberEvidence
      tags: [dashboards]
      summary: Save a project, certification, or work evidence item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEvidenceInput"
      responses:
        "201":
          description: Saved evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEvidence"
        "400":
          description: Invalid evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The idempotency key was already used for different evidence data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/evidence/{id}:
    patch:
      operationId: updateMemberEvidence
      tags: [dashboards]
      summary: Update or submit a member evidence item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEvidenceUpdate"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEvidence"
        "400":
          description: Invalid evidence update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Evidence is under review, final, or changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/passport:
    get:
      operationId: getMemberPassport
      tags: [passport]
      summary: Get the signed-in member Professional Passport
      responses:
        "200":
          description: Member passport and consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPassport"
        "403":
          description: Member role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMemberPassport
      tags: [passport]
      summary: Update public passport data, work preferences, and availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalPassportUpdate"
      responses:
        "200":
          description: Updated member passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPassport"
        "400":
          description: Invalid or duplicate passport data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Member role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/passport/consents:
    post:
      operationId: grantMemberCompanyConsent
      tags: [passport, talent-pool]
      summary: Grant Talent Pool consent to one company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCompanyConsentCreate"
      responses:
        "201":
          description: Created or renewed company consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyTalentConsent"
        "403":
          description: Member role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/passport/consents/{id}:
    patch:
      operationId: updateMemberCompanyConsent
      tags: [passport, talent-pool]
      summary: Grant, deny, or revoke one company consent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCompanyConsentUpdate"
      responses:
        "200":
          description: Updated company consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyTalentConsent"
        "404":
          description: Consent not found for this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/companies:
    get:
      operationId: listMemberCompanies
      tags: [passport, talent-pool]
      summary: List companies available for proactive member consent
      responses:
        "200":
          description: Safe company directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyDirectoryEntry"
  /passport/{slug}:
    get:
      operationId: getPublicPassport
      tags: [passport]
      summary: Get a public Professional Passport by unique slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public Professional Passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPassport"
        "404":
          description: Passport is missing or private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/talent-pool:
    get:
      operationId: getAdminTalentPool
      tags: [talent-pool, admin]
      summary: Filter member passports for Admin PBA
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [available, open_to_offer, unavailable]
        - name: consent
          in: query
          required: false
          schema:
            type: string
            enum: [all, requested, active, denied, revoked, expired]
            default: all
        - name: companyId
          in: query
          required: false
          schema:
            type: string
        - name: expiry
          in: query
          required: false
          schema:
            type: string
            enum: [all, next_30_days, expired]
            default: all
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Admin Talent Pool results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTalentConsentPage"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/talent-pool/consents/{id}:
    patch:
      operationId: overrideAdminTalentConsent
      tags: [talent-pool, admin]
      summary: Revoke or change expiry of one company consent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTalentConsentOverride"
      responses:
        "200":
          description: Updated consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTalentConsent"
        "404":
          description: Consent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/talent-pool/settings:
    get:
      operationId: getAdminTalentConsentSettings
      tags: [talent-pool, admin]
      summary: Get Talent Pool consent duration and expiry reminder settings
      responses:
        "200":
          description: Consent settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentConsentSettings"
    patch:
      operationId: updateAdminTalentConsentSettings
      tags: [talent-pool, admin]
      summary: Update Talent Pool consent duration and expiry reminder settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentConsentSettingsUpdate"
      responses:
        "200":
          description: Updated consent settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentConsentSettings"
  /company/talent-pool:
    get:
      operationId: getCompanyTalentPool
      tags: [talent-pool]
      summary: List only candidates with active Talent Pool consent
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [available, open_to_offer, unavailable]
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Consent-approved candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyTalentPoolPage"
        "403":
          description: Company role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/talent-pool/consent-requests:
    get:
      operationId: listCompanyConsentRequests
      tags: [talent-pool]
      summary: List consent requests made by the current company
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, requested, active, denied, revoked, expired]
            default: all
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Company consent requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyConsentRequestPage"
    post:
      operationId: requestCompanyTalentConsent
      tags: [talent-pool]
      summary: Request consent using a member-shared passport slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyConsentRequestInput"
      responses:
        "201":
          description: Created or refreshed consent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyConsentRequest"
        "404":
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/company:
    get:
      operationId: getCompanyDashboard
      tags: [dashboards]
      summary: Get company dashboard
      responses:
        "200":
          description: Company dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/requirements:
    get:
      operationId: listCompanyRequirements
      tags: [company]
      summary: List the current company's talent and training requirements
      responses:
        "200":
          description: Company requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyRequirement"
        "403":
          description: Company role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCompanyRequirement
      tags: [company]
      summary: Create a company talent or training requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequirementInput"
      responses:
        "201":
          description: Created requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRequirement"
        "400":
          description: Invalid requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/requirements/{id}:
    patch:
      operationId: updateCompanyRequirement
      tags: [company]
      summary: Update a company requirement owned by the current company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequirementUpdate"
      responses:
        "200":
          description: Updated requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRequirement"
        "400":
          description: Invalid requirement update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requirement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/talent-pool/matches:
    get:
      operationId: listCompanyTalentPool
      tags: [company]
      summary: List consented members ranked against a company requirement
      parameters:
        - name: requirementId
          in: query
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 0
        - name: location
          in: query
          schema:
            type: string
        - name: skkLevel
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
        - name: experienceMin
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 80
        - name: availability
          in: query
          schema:
            type: string
            enum: [available, open_to_offer, unavailable]
        - name: verificationStatus
          in: query
          schema:
            type: string
            enum: [verified, pending, unverified]
        - name: status
          in: query
          schema:
            type: string
            enum: [new, review, shortlisted, interview, placed, declined]
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Ranked talent pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentPoolMatchesPage"
        "404":
          description: Requirement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/matchings:
    get:
      operationId: listAdminMatchings
      tags: [admin]
      summary: Review consented matching candidates across company requirements
      parameters:
        - name: requirementId
          in: query
          schema:
            type: string
        - name: companyId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 0
        - name: location
          in: query
          schema:
            type: string
        - name: skkLevel
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
        - name: experienceMin
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 80
        - name: availability
          in: query
          schema:
            type: string
            enum: [available, open_to_offer, unavailable]
        - name: verificationStatus
          in: query
          schema:
            type: string
            enum: [verified, pending, unverified]
        - name: status
          in: query
          schema:
            type: string
            enum: [new, review, shortlisted, interview, placed, declined]
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching candidates visible to Admin PBA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatchingPage"
        "400":
          description: Invalid matching filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/shortlist:
    get:
      operationId: listCompanyShortlist
      tags: [company]
      summary: List active internal shortlist items still covered by candidate consent
      responses:
        "200":
          description: Active shortlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyMatching"
    post:
      operationId: createCompanyShortlist
      tags: [company]
      summary: Save a consented candidate to the company's shortlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyShortlistInput"
      responses:
        "201":
          description: Created shortlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMatching"
        "400":
          description: Invalid shortlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requirement or candidate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/shortlist/{id}:
    patch:
      operationId: updateCompanyShortlist
      tags: [company]
      summary: Move a company shortlist item through review, interview, and placement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyShortlistUpdate"
      responses:
        "200":
          description: Updated shortlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMatching"
        "400":
          description: Invalid shortlist update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Shortlist item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboards]
      summary: Get admin dashboard
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List published programs
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Published programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/operations:
    get:
      operationId: getAdminOperations
      tags: [admin]
      summary: Get the Admin PBA operations workspace
      responses:
        "200":
          description: Admin operation queues and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOperations"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/funnel:
    get:
      operationId: getAdminFunnel
      tags: [admin]
      summary: Get aggregate business funnel metrics for Admin PBA
      description: Returns only aggregate counts and metric definitions; no internal identifiers or participant-level data are returned.
      responses:
        "200":
          description: Aggregate business funnel metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFunnel"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/pilot-evaluation/options:
    get:
      operationId: getAdminPilotEvaluationOptions
      tags: [admin]
      summary: List safe anchors for the pilot evaluation
      description: Lists published Bimtek programs and open company requirements that an Admin may select as the pilot anchors. These option identifiers are only for making the protected selection request; the evaluation report itself is aggregate-only.
      responses:
        "200":
          description: Pilot evaluation anchor options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPilotEvaluationOptions"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/pilot-evaluation:
    get:
      operationId: getAdminPilotEvaluation
      tags: [admin]
      summary: Get aggregate metrics for one pilot cohort
      description: The cohort is the non-cancelled enrollment set for one selected program. The report contains no participant-level data, Clerk identifiers, company or member internal identifiers, or consent detail.
      parameters:
        - name: programId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: requirementId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Aggregate pilot evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPilotEvaluation"
        "400":
          description: Invalid or unavailable pilot anchors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/pilot-feedback:
    get:
      operationId: listAdminPilotFeedback
      tags: [admin]
      summary: List feedback items for one pilot anchor
      parameters:
        - name: programId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: requirementId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pilot feedback items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPilotFeedback"
        "400":
          description: Invalid pilot anchors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminPilotFeedback
      tags: [admin]
      summary: Record non-sensitive pilot feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPilotFeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPilotFeedbackCreated"
        "400":
          description: Invalid pilot feedback or unavailable anchor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/pilot-feedback/{id}:
    patch:
      operationId: resolveAdminPilotFeedback
      tags: [admin]
      summary: Resolve one pilot feedback item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPilotFeedbackUpdate"
      responses:
        "200":
          description: Feedback resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPilotFeedbackCreated"
        "400":
          description: Invalid feedback resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feedback item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List admin audit logs
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: Super admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/transactions/settlement:
    post:
      operationId: ingestAdminTransactionSettlement
      tags: [admin]
      summary: Ingest a bank settlement from a payment source
      description: Match a settlement to exactly one transaction using its referenceId or invoiceNumber. Replaying the same settlement is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionSettlementIngest"
      responses:
        "200":
          description: Updated transaction settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid settlement payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Settlement identifiers are ambiguous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/verifications/{id}/decision:
    post:
      operationId: decideVerification
      tags: [admin]
      summary: Approve, request changes, or reject a verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecisionInput"
      responses:
        "200":
          description: Updated verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Verification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Verification is not pending or was decided concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/programs:
    post:
      operationId: createAdminProgram
      tags: [admin]
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/programs/{id}:
    patch:
      operationId: updateAdminProgram
      tags: [admin]
      summary: Update program details or publish status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/enrollments/{id}:
    patch:
      operationId: updateAdminEnrollment
      tags: [admin]
      summary: Approve, cancel, or complete an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
  /admin/matchings/{id}:
    patch:
      operationId: updateAdminMatching
      tags: [admin]
      summary: Update shortlist or placement pipeline status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingUpdate"
      responses:
        "200":
          description: Updated matching
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matching"
  /admin/transactions/{id}:
    patch:
      operationId: updateAdminTransaction
      tags: [admin]
      summary: Update a transaction settlement status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /admin/transactions/{id}/reconciliation:
    patch:
      operationId: resolveAdminTransactionReconciliation
      tags: [admin]
      summary: Resolve a transaction reconciliation exception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionReconciliationResolution"
      responses:
        "200":
          description: Resolved transaction reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid resolution note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Super admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Role:
      type: string
      enum: [member, company, admin, super_admin]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        onboardingComplete:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        organization:
          type: ["string", "null"]
      required: [id, name, email, role, onboardingComplete, avatarUrl, organization]
    MemberOnboardingInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 8
        domicile:
          type: string
          minLength: 2
        education:
          type: string
        jobTitle:
          type: string
        skkLevel:
          type: integer
          minimum: 0
          maximum: 9
        expertise:
          type: string
        experienceYears:
          type: number
          minimum: 0
          maximum: 80
        primaryGoal:
          type: string
          enum: [skk, competency, job, career]
        dataConsent:
          type: boolean
      required: [fullName, phone, domicile, education, expertise, experienceYears, primaryGoal, dataConsent]
    CompanyOnboardingInput:
      type: object
      properties:
        companyName:
          type: string
          minLength: 2
        companyType:
          type: string
        phone:
          type: string
          minLength: 8
        businessEmail:
          type: string
        address:
          type: string
        picName:
          type: string
        picTitle:
          type: string
        primaryNeed:
          type: string
          enum: [training, certification, talent, compliance]
      required: [companyName, companyType, phone, businessEmail, address, picName, picTitle, primaryNeed]
    Metric:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: ["string", "null"]
        tone:
          type: string
          enum: [neutral, positive, warning, attention]
      required: [label, value, change, tone]
    ActionItem:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        href:
          type: string
        tone:
          type: string
          enum: [primary, neutral, warning]
      required: [title, description, href, tone]
    MemberDashboard:
      type: object
      properties:
        greeting:
          type: string
        profileCompletion:
          type: number
        readinessScore:
          type: number
        readinessLabel:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        nextAction:
          $ref: "#/components/schemas/ActionItem"
        activeProgram:
          type: ["string", "null"]
        progress:
          type: number
        notificationsCount:
          type: number
      required: [greeting, profileCompletion, readinessScore, readinessLabel, metrics, nextAction, activeProgram, progress, notificationsCount]
    MemberJourney:
      type: object
      properties:
        diagnostic:
          oneOf:
            - $ref: "#/components/schemas/ReadinessDiagnostic"
            - type: "null"
        evidences:
          type: array
          items:
            $ref: "#/components/schemas/MemberEvidence"
        learningProgress:
          type: array
          items:
            $ref: "#/components/schemas/LearningProgress"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/Matching"
        recommendedPrograms:
          type: array
          items:
            $ref: "#/components/schemas/Program"
      required: [diagnostic, evidences, learningProgress, opportunities, recommendedPrograms]
    PassportConsent:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [talent_pool]
        status:
          type: string
          enum: [active, revoked]
        grantedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, scope, status, grantedAt, revokedAt, updatedAt]
    CompanyTalentConsent:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        companyName:
          type: string
        companyType:
          type: string
        status:
          type: string
          enum: [requested, active, denied, revoked, expired]
        requestedAt:
          type: string
          format: date-time
        grantedAt:
          type: ["string", "null"]
          format: date-time
        deniedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        expiredAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        consentVersion:
          type: integer
        requestNote:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: "#/components/schemas/CompanyConsentHistoryEntry"
      required: [id, companyId, companyName, companyType, status, requestedAt, grantedAt, deniedAt, revokedAt, expiredAt, expiresAt, consentVersion, requestNote, decisionNote, updatedAt, history]
    CompanyConsentHistoryEntry:
      type: object
      properties:
        consentVersion:
          type: integer
          minimum: 1
        action:
          type: string
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        actorRole:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [consentVersion, action, fromStatus, toStatus, note, actorRole, createdAt]
    TalentConsentSettings:
      type: object
      properties:
        defaultDurationDays:
          type: integer
          minimum: 1
          maximum: 365
        reminderDaysBeforeExpiry:
          type: integer
          minimum: 1
          maximum: 365
        updatedAt:
          type: string
          format: date-time
      required: [defaultDurationDays, reminderDaysBeforeExpiry, updatedAt]
    TalentConsentSettingsUpdate:
      type: object
      properties:
        defaultDurationDays:
          type: integer
          minimum: 1
          maximum: 365
        reminderDaysBeforeExpiry:
          type: integer
          minimum: 1
          maximum: 365
        note:
          type: string
          minLength: 3
          maxLength: 300
      required: [defaultDurationDays, note]
    MemberCompanyConsentCreate:
      type: object
      properties:
        companyId:
          type: string
        note:
          type: string
          maxLength: 300
      required: [companyId]
    MemberCompanyConsentUpdate:
      type: object
      properties:
        action:
          type: string
          enum: [grant, deny, revoke]
        note:
          type: string
          maxLength: 300
      required: [action]
    CompanyDirectoryEntry:
      type: object
      properties:
        id:
          type: string
        companyName:
          type: string
        companyType:
          type: string
      required: [id, companyName, companyType]
    MemberPassport:
      type: object
      properties:
        id:
          type: string
        memberUserId:
          type: string
        slug:
          type: string
        isPublic:
          type: boolean
        headline:
          type: string
        bio:
          type: string
        preferredRoles:
          type: array
          items:
            type: string
        preferredLocations:
          type: array
          items:
            type: string
        preferredWorkModes:
          type: array
          items:
            type: string
        availabilityStatus:
          type: string
          enum: [available, open_to_offer, unavailable]
        publicUrl:
          type: string
        consents:
          type: array
          items:
            $ref: "#/components/schemas/CompanyTalentConsent"
        consentSettings:
          $ref: "#/components/schemas/TalentConsentSettings"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, memberUserId, slug, isPublic, headline, bio, preferredRoles, preferredLocations, preferredWorkModes, availabilityStatus, publicUrl, consents, consentSettings, createdAt, updatedAt]
    ProfessionalPassportUpdate:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 3
          maxLength: 60
        isPublic:
          type: boolean
        headline:
          type: string
          maxLength: 120
        bio:
          type: string
          maxLength: 800
        preferredRoles:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 80
        preferredLocations:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 80
        preferredWorkModes:
          type: array
          maxItems: 5
          items:
            type: string
            enum: [onsite, hybrid, remote]
        availabilityStatus:
          type: string
          enum: [available, open_to_offer, unavailable]
      minProperties: 1
    PassportConsentUpdate:
      type: object
      properties:
        active:
          type: boolean
      required: [active]
    PublicPassport:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        headline:
          type: string
        bio:
          type: string
        expertise:
          type: string
        domicile:
          type: string
        experienceYears:
          type: number
        preferredRoles:
          type: array
          items:
            type: string
        preferredLocations:
          type: array
          items:
            type: string
        preferredWorkModes:
          type: array
          items:
            type: string
        availabilityStatus:
          type: string
          enum: [available, open_to_offer, unavailable]
        verifiedEvidenceCount:
          type: number
        publicUrl:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [slug, name, headline, bio, expertise, domicile, experienceYears, preferredRoles, preferredLocations, preferredWorkModes, availabilityStatus, verifiedEvidenceCount, publicUrl, updatedAt]
    AdminTalentCandidate:
      type: object
      properties:
        id:
          type: string
        memberUserId:
          type: string
        name:
          type: string
        headline:
          type: string
        expertise:
          type: string
        domicile:
          type: string
        experienceYears:
          type: number
        preferredRoles:
          type: array
          items:
            type: string
        preferredLocations:
          type: array
          items:
            type: string
        preferredWorkModes:
          type: array
          items:
            type: string
        availabilityStatus:
          type: string
          enum: [available, open_to_offer, unavailable]
        isPublic:
          type: boolean
        consentStatus:
          type: string
          enum: [active, revoked]
        consentGrantedAt:
          type: ["string", "null"]
          format: date-time
        publicUrl:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required: [id, memberUserId, name, headline, expertise, domicile, experienceYears, preferredRoles, preferredLocations, preferredWorkModes, availabilityStatus, isPublic, consentStatus, consentGrantedAt, publicUrl, updatedAt]
    AdminTalentConsent:
      type: object
      properties:
        id:
          type: string
        memberUserId:
          type: string
        memberName:
          type: string
        companyUserId:
          type: string
        companyName:
          type: string
        status:
          type: string
          enum: [requested, active, denied, revoked, expired]
        grantedAt:
          type: ["string", "null"]
          format: date-time
        deniedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        expiredAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        consentVersion:
          type: integer
        grantedBy:
          type: ["string", "null"]
        revokedBy:
          type: ["string", "null"]
        requestNote:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required: [id, memberUserId, memberName, companyUserId, companyName, status, grantedAt, deniedAt, revokedAt, expiredAt, expiresAt, consentVersion, grantedBy, revokedBy, requestNote, decisionNote, updatedAt]
    AdminTalentConsentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTalentConsent"
        page:
