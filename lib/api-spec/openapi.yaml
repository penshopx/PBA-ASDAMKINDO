openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Signed-in user identity and onboarding
  - name: dashboards
    description: Role-based dashboard summaries
  - name: programs
    description: Public program catalog
  - name: notifications
    description: In-app notifications
  - name: admin
    description: Admin PBA operations and governance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get current user
      description: Returns the signed-in user's role and onboarding profile.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/member:
    post:
      operationId: saveMemberOnboarding
      tags: [identity]
      summary: Save member onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberOnboardingInput"
      responses:
        "200":
          description: Saved member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid onboarding data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/company:
    post:
      operationId: saveCompanyOnboarding
      tags: [identity]
      summary: Save company onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyOnboardingInput"
      responses:
        "200":
          description: Saved company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid onboarding data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/member:
    get:
      operationId: getMemberDashboard
      tags: [dashboards]
      summary: Get member dashboard
      responses:
        "200":
          description: Member dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/journey:
    get:
      operationId: getMemberJourney
      tags: [dashboards]
      summary: Get the complete member competency journey
      responses:
        "200":
          description: Diagnostic, evidence, learning progress, opportunities, and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberJourney"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/diagnostics:
    post:
      operationId: saveMemberDiagnostic
      tags: [dashboards]
      summary: Save a member readiness diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberDiagnosticInput"
      responses:
        "200":
          description: Saved readiness diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDiagnostic"
        "400":
          description: Invalid diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/evidence:
    post:
      operationId: saveMemberEvidence
      tags: [dashboards]
      summary: Save a project, certification, or work evidence item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEvidenceInput"
      responses:
        "201":
          description: Saved evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEvidence"
        "400":
          description: Invalid evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/evidence/{id}:
    patch:
      operationId: updateMemberEvidence
      tags: [dashboards]
      summary: Update or submit a member evidence item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEvidenceUpdate"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEvidence"
        "400":
          description: Invalid evidence update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/company:
    get:
      operationId: getCompanyDashboard
      tags: [dashboards]
      summary: Get company dashboard
      responses:
        "200":
          description: Company dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboards]
      summary: Get admin dashboard
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List published programs
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Published programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /admin/operations:
    get:
      operationId: getAdminOperations
      tags: [admin]
      summary: Get the Admin PBA operations workspace
      responses:
        "200":
          description: Admin operation queues and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOperations"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List admin audit logs
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: Super admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/verifications/{id}/decision:
    post:
      operationId: decideVerification
      tags: [admin]
      summary: Approve, request changes, or reject a verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecisionInput"
      responses:
        "200":
          description: Updated verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Verification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/programs:
    post:
      operationId: createAdminProgram
      tags: [admin]
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/programs/{id}:
    patch:
      operationId: updateAdminProgram
      tags: [admin]
      summary: Update program details or publish status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/enrollments/{id}:
    patch:
      operationId: updateAdminEnrollment
      tags: [admin]
      summary: Approve, cancel, or complete an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
  /admin/matchings/{id}:
    patch:
      operationId: updateAdminMatching
      tags: [admin]
      summary: Update shortlist or placement pipeline status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingUpdate"
      responses:
        "200":
          description: Updated matching
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matching"
  /admin/transactions/{id}:
    patch:
      operationId: updateAdminTransaction
      tags: [admin]
      summary: Update a transaction settlement status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Role:
      type: string
      enum: [member, company, admin, super_admin]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        onboardingComplete:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        organization:
          type: ["string", "null"]
      required: [id, name, email, role, onboardingComplete, avatarUrl, organization]
    MemberOnboardingInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 8
        domicile:
          type: string
          minLength: 2
        education:
          type: string
        expertise:
          type: string
        experienceYears:
          type: number
          minimum: 0
          maximum: 80
        primaryGoal:
          type: string
          enum: [skk, competency, job, career]
        dataConsent:
          type: boolean
      required: [fullName, phone, domicile, education, expertise, experienceYears, primaryGoal, dataConsent]
    CompanyOnboardingInput:
      type: object
      properties:
        companyName:
          type: string
          minLength: 2
        companyType:
          type: string
        phone:
          type: string
          minLength: 8
        businessEmail:
          type: string
        address:
          type: string
        picName:
          type: string
        picTitle:
          type: string
        primaryNeed:
          type: string
          enum: [training, certification, talent, compliance]
      required: [companyName, companyType, phone, businessEmail, address, picName, picTitle, primaryNeed]
    Metric:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: ["string", "null"]
        tone:
          type: string
          enum: [neutral, positive, warning, attention]
      required: [label, value, change, tone]
    ActionItem:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        href:
          type: string
        tone:
          type: string
          enum: [primary, neutral, warning]
      required: [title, description, href, tone]
    MemberDashboard:
      type: object
      properties:
        greeting:
          type: string
        profileCompletion:
          type: number
        readinessScore:
          type: number
        readinessLabel:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        nextAction:
          $ref: "#/components/schemas/ActionItem"
        activeProgram:
          type: ["string", "null"]
        progress:
          type: number
        notificationsCount:
          type: number
      required: [greeting, profileCompletion, readinessScore, readinessLabel, metrics, nextAction, activeProgram, progress, notificationsCount]
    MemberJourney:
      type: object
      properties:
        diagnostic:
          oneOf:
            - $ref: "#/components/schemas/ReadinessDiagnostic"
            - type: "null"
        evidences:
          type: array
          items:
            $ref: "#/components/schemas/MemberEvidence"
        learningProgress:
          type: array
          items:
            $ref: "#/components/schemas/LearningProgress"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/Matching"
        recommendedPrograms:
          type: array
          items:
            $ref: "#/components/schemas/Program"
      required: [diagnostic, evidences, learningProgress, opportunities, recommendedPrograms]
    MemberDiagnosticInput:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: number
            minimum: 1
            maximum: 5
        areaLabels:
          type: object
          additionalProperties:
            type: string
      required: [answers, areaLabels]
    ReadinessDiagnostic:
      type: object
      properties:
        id:
          type: string
        memberUserId:
          type: string
        score:
          type: number
        answers:
          type: object
          additionalProperties:
            type: number
        focusAreas:
          type: array
          items:
            type: string
        completedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, memberUserId, score, answers, focusAreas, completedAt, updatedAt]
    MemberEvidence:
      type: object
      properties:
        id:
          type: string
        memberUserId:
          type: string
        evidenceType:
          type: string
          enum: [project, certification, work]
        title:
          type: string
        description:
          type: string
        referenceUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted, verified]
        submittedAt:
          type: ["string", "null"]
          format: date-time
        verifiedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, memberUserId, evidenceType, title, description, referenceUrl, status, submittedAt, verifiedAt, createdAt, updatedAt]
    MemberEvidenceInput:
      type: object
      properties:
        evidenceType:
          type: string
          enum: [project, certification, work]
        title:
          type: string
          minLength: 2
        description:
          type: string
        referenceUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted]
      required: [evidenceType, title, description, status]
    MemberEvidenceUpdate:
      type: object
      properties:
        evidenceType:
          type: string
          enum: [project, certification, work]
        title:
          type: string
          minLength: 2
        description:
          type: string
        referenceUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted]
    LearningProgress:
      type: object
      properties:
        id:
          type: string
        programId:
          type: string
        programName:
          type: string
        status:
          type: string
          enum: [pending, enrolled, completed, cancelled]
        progress:
          type: number
        currentMilestone:
          type: string
        milestones:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, programId, programName, status, progress, currentMilestone, milestones, updatedAt]
    CompanyDashboard:
      type: object
      properties:
        greeting:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        nextAction:
          $ref: "#/components/schemas/ActionItem"
        activeRequirements:
          type: number
        matchingCandidates:
          type: number
        shortlistCount:
          type: number
        notificationsCount:
          type: number
      required: [greeting, metrics, nextAction, activeRequirements, matchingCandidates, shortlistCount, notificationsCount]
    AdminDashboard:
      type: object
      properties:
        greeting:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        nextAction:
          $ref: "#/components/schemas/ActionItem"
        pendingVerifications:
          type: number
        activeMembers:
          type: number
        activeCompanies:
          type: number
        activeRequirements:
          type: number
        placements:
          type: number
        revenue:
          type: string
      required: [greeting, metrics, nextAction, pendingVerifications, activeMembers, activeCompanies, activeRequirements, placements, revenue]
    Program:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        mode:
          type: string
        schedule:
          type: string
        duration:
          type: string
        price:
          type: number
        instructor:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published]
        capacity:
          type: number
        enrolledCount:
          type: number
        completedCount:
          type: number
      required: [id, name, category, mode, schedule, duration, price, instructor, description, status, capacity, enrolledCount, completedCount]
    ProgramInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        category:
          type: string
        mode:
          type: string
        schedule:
          type: string
        duration:
          type: string
        price:
          type: number
          minimum: 0
        instructor:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published]
        capacity:
          type: number
          minimum: 1
      required: [name, category, mode, schedule, duration, price, instructor, description, status, capacity]
    ProgramUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        category:
          type: string
        mode:
          type: string
        schedule:
          type: string
        duration:
          type: string
        price:
          type: number
          minimum: 0
        instructor:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published]
        capacity:
          type: number
          minimum: 1
    Verification:
      type: object
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum: [profile, document, competency]
        subjectId:
          type: string
        subjectName:
          type: string
        evidenceType:
          type: string
        status:
          type: string
          enum: [pending, approved, changes_requested, rejected]
        submittedByUserId:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedByUserId:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
      required: [id, subjectType, subjectId, subjectName, evidenceType, status, submittedByUserId, submittedAt, reviewedByUserId, reviewedAt, reviewNote]
    VerificationDecisionInput:
      type: object
      properties:
        status:
          type: string
          enum: [approved, changes_requested, rejected]
        note:
          type: string
          minLength: 3
      required: [status, note]
    AdminProgram:
      allOf:
        - $ref: "#/components/schemas/Program"
        - type: object
          properties:
            enrollmentCount:
              type: number
            completionCount:
              type: number
          required: [enrollmentCount, completionCount]
    Enrollment:
      type: object
      properties:
        id:
          type: string
        programId:
          type: string
        programName:
          type: string
        memberUserId:
          type: string
        memberName:
          type: string
        status:
          type: string
          enum: [pending, enrolled, completed, cancelled]
        enrolledAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, programId, programName, memberUserId, memberName, status, enrolledAt, completedAt, createdAt]
    EnrollmentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, enrolled, completed, cancelled]
        note:
          type: string
          minLength: 3
      required: [status]
    Matching:
      type: object
      properties:
        id:
          type: string
        requirement:
          type: string
        companyName:
          type: string
        candidateUserId:
          type: ["string", "null"]
        candidateName:
          type: string
        score:
          type: number
        status:
          type: string
          enum: [new, shortlisted, interview, placed, declined]
        updatedAt:
          type: string
          format: date-time
      required: [id, requirement, companyName, candidateUserId, candidateName, score, status, updatedAt]
    MatchingUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, shortlisted, interview, placed, declined]
        note:
          type: string
          minLength: 3
      required: [status]
    Transaction:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [program, placement]
        referenceId:
          type: string
        customerName:
          type: string
        amount:
          type: number
        commission:
          type: number
        status:
          type: string
          enum: [pending, paid, refunded]
        occurredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, kind, referenceId, customerName, amount, commission, status, occurredAt, updatedAt]
    TransactionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, refunded]
        note:
          type: string
          minLength: 3
      required: [status, note]
    AuditLog:
      type: object
      properties:
        id:
          type: string
        actorUserId:
          type: string
        actorName:
          type: string
        actorRole:
          $ref: "#/components/schemas/Role"
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, actorUserId, actorName, actorRole, action, entityType, entityId, fromStatus, toStatus, note, createdAt]
    AdminPermissions:
      type: object
      properties:
        canReviewVerifications:
          type: boolean
        canManagePrograms:
          type: boolean
        canManageEnrollments:
          type: boolean
