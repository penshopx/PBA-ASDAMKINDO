openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Signed-in user identity and onboarding
  - name: dashboards
    description: Role-based dashboard summaries
  - name: programs
    description: Public program catalog
  - name: notifications
    description: In-app notifications
  - name: admin
    description: Admin PBA operations and governance
  - name: passport
    description: Professional Passport settings and public profile
  - name: talent-pool
    description: Consent-aware Talent Pool discovery
  - name: company
    description: Company talent requirements and consented talent pool
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get current user
      description: Returns the signed-in user's role and onboarding profile.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/member:
    post:
      operationId: saveMemberOnboarding
      tags: [identity]
      summary: Save member onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberOnboardingInput"
      responses:
        "200":
          description: Saved member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid onboarding data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/company:
    post:
      operationId: saveCompanyOnboarding
      tags: [identity]
      summary: Save company onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyOnboardingInput"
      responses:
        "200":
          description: Saved company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid onboarding data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/member:
    get:
      operationId: getMemberDashboard
      tags: [dashboards]
      summary: Get member dashboard
      responses:
        "200":
          description: Member dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/journey:
    get:
      operationId: getMemberJourney
      tags: [dashboards]
      summary: Get the complete member competency journey
      responses:
        "200":
          description: Diagnostic, evidence, learning progress, opportunities, and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberJourney"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/diagnostics:
    post:
      operationId: saveMemberDiagnostic
      tags: [dashboards]
      summary: Save a member readiness diagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberDiagnosticInput"
      responses:
        "200":
          description: Saved readiness diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDiagnostic"
        "400":
          description: Invalid diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/evidence:
    post:
      operationId: saveMemberEvidence
      tags: [dashboards]
      summary: Save a project, certification, or work evidence item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEvidenceInput"
      responses:
        "201":
          description: Saved evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEvidence"
        "400":
          description: Invalid evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/evidence/{id}:
    patch:
      operationId: updateMemberEvidence
      tags: [dashboards]
      summary: Update or submit a member evidence item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberEvidenceUpdate"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEvidence"
        "400":
          description: Invalid evidence update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/passport:
    get:
      operationId: getMemberPassport
      tags: [passport]
      summary: Get the signed-in member Professional Passport
      responses:
        "200":
          description: Member passport and consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPassport"
        "403":
          description: Member role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMemberPassport
      tags: [passport]
      summary: Update public passport data, work preferences, and availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalPassportUpdate"
      responses:
        "200":
          description: Updated member passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPassport"
        "400":
          description: Invalid or duplicate passport data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Member role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /member/passport/consent:
    patch:
      operationId: updateMemberPassportConsent
      tags: [passport]
      summary: Grant or revoke Talent Pool consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassportConsentUpdate"
      responses:
        "200":
          description: Updated consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassportConsent"
        "403":
          description: Member role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /passport/{slug}:
    get:
      operationId: getPublicPassport
      tags: [passport]
      summary: Get a public Professional Passport by unique slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public Professional Passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPassport"
        "404":
          description: Passport is missing or private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/talent-pool:
    get:
      operationId: getAdminTalentPool
      tags: [talent-pool, admin]
      summary: Filter member passports for Admin PBA
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [available, open_to_offer, unavailable]
        - name: consent
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, revoked]
            default: all
        - name: location
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Admin Talent Pool results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTalentCandidate"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/talent-pool:
    get:
      operationId: getCompanyTalentPool
      tags: [talent-pool]
      summary: List only candidates with active Talent Pool consent
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [available, open_to_offer, unavailable]
        - name: location
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Consent-approved candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyTalentCandidate"
        "403":
          description: Company role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/company:
    get:
      operationId: getCompanyDashboard
      tags: [dashboards]
      summary: Get company dashboard
      responses:
        "200":
          description: Company dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/requirements:
    get:
      operationId: listCompanyRequirements
      tags: [company]
      summary: List the current company's talent and training requirements
      responses:
        "200":
          description: Company requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyRequirement"
        "403":
          description: Company role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCompanyRequirement
      tags: [company]
      summary: Create a company talent or training requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequirementInput"
      responses:
        "201":
          description: Created requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRequirement"
        "400":
          description: Invalid requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/requirements/{id}:
    patch:
      operationId: updateCompanyRequirement
      tags: [company]
      summary: Update a company requirement owned by the current company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequirementUpdate"
      responses:
        "200":
          description: Updated requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRequirement"
        "400":
          description: Invalid requirement update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requirement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/talent-pool/matches:
    get:
      operationId: listCompanyTalentPool
      tags: [company]
      summary: List consented members ranked against a company requirement
      parameters:
        - name: requirementId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ranked talent pool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TalentPoolCandidate"
        "404":
          description: Requirement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/shortlist:
    post:
      operationId: createCompanyShortlist
      tags: [company]
      summary: Save a consented candidate to the company's shortlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyShortlistInput"
      responses:
        "201":
          description: Created shortlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matching"
        "400":
          description: Invalid shortlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requirement or candidate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /company/shortlist/{id}:
    patch:
      operationId: updateCompanyShortlist
      tags: [company]
      summary: Move a company shortlist item through review, interview, and placement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyShortlistUpdate"
      responses:
        "200":
          description: Updated shortlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matching"
        "400":
          description: Invalid shortlist update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Shortlist item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboards]
      summary: Get admin dashboard
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List published programs
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Published programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/operations:
    get:
      operationId: getAdminOperations
      tags: [admin]
      summary: Get the Admin PBA operations workspace
      responses:
        "200":
          description: Admin operation queues and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOperations"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List admin audit logs
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: Super admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/verifications/{id}/decision:
    post:
      operationId: decideVerification
      tags: [admin]
      summary: Approve, request changes, or reject a verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecisionInput"
      responses:
        "200":
          description: Updated verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Verification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/programs:
    post:
      operationId: createAdminProgram
      tags: [admin]
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/programs/{id}:
    patch:
      operationId: updateAdminProgram
      tags: [admin]
      summary: Update program details or publish status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/enrollments/{id}:
    patch:
      operationId: updateAdminEnrollment
      tags: [admin]
      summary: Approve, cancel, or complete an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
  /admin/matchings/{id}:
    patch:
      operationId: updateAdminMatching
      tags: [admin]
      summary: Update shortlist or placement pipeline status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingUpdate"
      responses:
        "200":
          description: Updated matching
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matching"
  /admin/transactions/{id}:
    patch:
      operationId: updateAdminTransaction
      tags: [admin]
      summary: Update a transaction settlement status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /admin/transactions/{id}/reconciliation:
    patch:
      operationId: resolveAdminTransactionReconciliation
      tags: [admin]
      summary: Resolve a transaction reconciliation exception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionReconciliationResolution"
      responses:
        "200":
          description: Resolved transaction reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid resolution note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Super admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Role:
      type: string
      enum: [member, company, admin, super_admin]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        onboardingComplete:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        organization:
          type: ["string", "null"]
      required: [id, name, email, role, onboardingComplete, avatarUrl, organization]
    MemberOnboardingInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 8
        domicile:
          type: string
          minLength: 2
        education:
          type: string
        expertise:
          type: string
        experienceYears:
          type: number
          minimum: 0
          maximum: 80
        primaryGoal:
          type: string
          enum: [skk, competency, job, career]
        dataConsent:
          type: boolean
      required: [fullName, phone, domicile, education, expertise, experienceYears, primaryGoal, dataConsent]
    CompanyOnboardingInput:
      type: object
      properties:
        companyName:
          type: string
          minLength: 2
        companyType:
          type: string
        phone:
          type: string
          minLength: 8
        businessEmail:
          type: string
        address:
          type: string
        picName:
          type: string
        picTitle:
          type: string
        primaryNeed:
          type: string
          enum: [training, certification, talent, compliance]
      required: [companyName, companyType, phone, businessEmail, address, picName, picTitle, primaryNeed]
    Metric:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: ["string", "null"]
        tone:
          type: string
          enum: [neutral, positive, warning, attention]
      required: [label, value, change, tone]
    ActionItem:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        href:
          type: string
        tone:
          type: string
          enum: [primary, neutral, warning]
      required: [title, description, href, tone]
    MemberDashboard:
      type: object
      properties:
        greeting:
          type: string
        profileCompletion:
          type: number
        readinessScore:
          type: number
        readinessLabel:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        nextAction:
          $ref: "#/components/schemas/ActionItem"
        activeProgram:
          type: ["string", "null"]
        progress:
          type: number
        notificationsCount:
          type: number
      required: [greeting, profileCompletion, readinessScore, readinessLabel, metrics, nextAction, activeProgram, progress, notificationsCount]
    MemberJourney:
      type: object
      properties:
        diagnostic:
          oneOf:
            - $ref: "#/components/schemas/ReadinessDiagnostic"
            - type: "null"
        evidences:
          type: array
          items:
            $ref: "#/components/schemas/MemberEvidence"
        learningProgress:
          type: array
          items:
            $ref: "#/components/schemas/LearningProgress"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/Matching"
        recommendedPrograms:
          type: array
          items:
            $ref: "#/components/schemas/Program"
      required: [diagnostic, evidences, learningProgress, opportunities, recommendedPrograms]
    PassportConsent:
      type: object
      properties:
        id:
