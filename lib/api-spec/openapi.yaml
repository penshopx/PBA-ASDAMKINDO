    AdminFunnelMetric:
      type: object
      description: One aggregate funnel metric. This response deliberately contains no internal identifiers.
      properties:
        key:
          type: string
          enum: [registrations, completedDiagnostics, paidParticipants, activeTalent, openCompanyRequirements, matchingRecords, shortlistPipeline, placements]
        label:
          type: string
        value:
          type: integer
          minimum: 0
        definition:
          type: string
          description: Definisi metrik dalam Bahasa Indonesia, termasuk batasan data yang dihitung.
      required: [key, label, value, definition]
    AdminFunnel:
      type: object
      description: Ringkasan funnel bisnis agregat untuk Admin dan Super Admin.
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/AdminFunnelMetric"
      required: [metrics]
    AdminPilotProgramOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
      required: [id, name, category]
    AdminPilotRequirementOption:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        companyName:
          type: string
      required: [id, title, companyName]
    AdminPilotEvaluationOptions:
      type: object
      description: Opsi anchor untuk memilih satu program dan satu kebutuhan perusahaan pada UI Admin.
      properties:
        programs:
          type: array
          items:
            $ref: "#/components/schemas/AdminPilotProgramOption"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/AdminPilotRequirementOption"
      required: [programs, requirements]
    AdminPilotMetric:
      type: object
      description: Satu metrik evaluasi pilot yang hanya berisi angka agregat.
      properties:
        key:
          type: string
          enum: [registrations, completedDiagnostics, paidParticipants, completionRate, activeConsent, verifiedTalent, matchedCandidates, shortlistPipeline, placementSimulation, complaints, adminResponseTimeHours]
        label:
          type: string
        value:
          type: ["number", "null"]
          minimum: 0
        unit:
          type: string
          enum: [count, percentage, hours]
        denominator:
          type: ["integer", "null"]
          minimum: 0
        definition:
          type: string
      required: [key, label, value, unit, denominator, definition]
    AdminPilotFunnelStage:
      type: object
      description: Satu tahap funnel cohort dengan jumlah dan persentase terhadap cohort.
      properties:
        key:
          type: string
          enum: [registrations, completedDiagnostics, paidParticipants, completedProgram, activeConsent, matchedCandidates, shortlistPipeline, placementSimulation]
        label:
          type: string
        count:
          type: integer
          minimum: 0
        percentage:
          type: number
          minimum: 0
          maximum: 100
        definition:
          type: string
      required: [key, label, count, percentage, definition]
    AdminPilotCohort:
      type: object
      description: Konteks aman cohort tanpa identifier internal.
      properties:
        programName:
          type: string
        requirementTitle:
          type: string
        companyName:
          type: string
        participantCount:
          type: integer
          minimum: 0
      required: [programName, requirementTitle, companyName, participantCount]
    AdminPilotEvaluation:
      type: object
      description: Laporan aggregate-only untuk evaluasi pilot terbatas.
      properties:
        targetParticipants:
          type: integer
          minimum: 1
        cohort:
          $ref: "#/components/schemas/AdminPilotCohort"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/AdminPilotMetric"
        funnel:
          type: array
          items:
            $ref: "#/components/schemas/AdminPilotFunnelStage"
      required: [targetParticipants, cohort, metrics, funnel]
    AdminPilotFeedback:
      type: object
      description: Feedback operasional non-sensitif; endpoint ini terpisah dari laporan aggregate-only.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [open, resolved]
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, status, note, createdAt, resolvedAt]
    AdminPilotFeedbackInput:
      type: object
      properties:
        programId:
          type: string
          minLength: 1
        requirementId:
          type: string
          minLength: 1
        note:
          type: string
          minLength: 3
          maxLength: 500
      required: [programId, requirementId, note]
    AdminPilotFeedbackUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [resolved]
        note:
          type: string
          minLength: 3
          maxLength: 500
      required: [status]
    AdminPilotFeedbackCreated:
      type: object
      properties:
        status:
          type: string
          enum: [recorded, resolved]
      required: [status]
    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
        type:
          type: string
          enum: [profile, document, program, learning, recruitment, system]
      required: [id, title, description, createdAt, read, type]
